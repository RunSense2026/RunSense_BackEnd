server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: runsense

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "DEALLOCATE ALL"
      # Supabase 트랜잭션 풀러(6543)는 요청마다 다른 커넥션을 붙여 서버 측 prepared statement가 충돌한다
      # ("S_1" already exists/does not exist → 500). DB_URL에 옵션이 빠져도 항상 꺼지도록 고정
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      # 초기 개발 단계에서는 update 권장, 운영 시에는 validate 사용
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION}
  ai:
    api-url: ${AI_API_URL}
  public-api:
    kma-url: ${KMA_API_URL}
    air-korea-url: ${AIR_KOREA_API_URL}
    service-key: ${PUBLIC_API_KEY}