server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: runsense

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "DEALLOCATE ALL"

  jpa:
    hibernate:
      # 초기 개발 단계에서는 update 권장, 운영 시에는 validate 사용
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION}
  ai:
    api-url: ${AI_API_URL}